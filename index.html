<title>Ficha — Meso 1 Corpo Inteiro</title>

<style>
  /* ---------- tokens: paleta derivada do código de cores de anilha olímpica ---------- */
  :root {
    --bg:        #EDEFF1;
    --surface:   #FFFFFF;
    --surface-2: #F4F6F8;
    --line:      #D2D8DE;
    --line-soft: #E3E8EC;
    --ink:       #161A1F;
    --ink-2:     #5B6570;
    --ink-3:     #8A959F;
    --accent:    #1F5FBF;
    --ok:        #2E7D4F;
    --warn:      #A85E16;
    --danger:    #A82E27;
    --ok-bg:     #E4F1E9;
    --warn-bg:   #F8EEE0;
    --danger-bg: #F6E5E4;
    --shadow:    0 1px 2px rgba(20,28,38,.07), 0 6px 16px -8px rgba(20,28,38,.16);

    /* anilhas: 20kg azul, 25kg vermelho, 10kg verde, 15kg amarelo, 5kg branco */
    --plate-a: #1F5FBF;
    --plate-b: #A82E27;
    --plate-e: #2E7D4F;
    --plate-c: #A85E16;
    --plate-d: #4A555F;

    /* séries de gráfico — validadas para CVD e contraste no modo claro */
    --s1: #1F5FBF;
    --s2: #A85E16;
    --grid: #E3E8EC;

    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        #0F1216;
      --surface:   #171B21;
      --surface-2: #1E242B;
      --line:      #2B333C;
      --line-soft: #232A32;
      --ink:       #E9EDF1;
      --ink-2:     #94A0AC;
      --ink-3:     #6C7885;
      --accent:    #5D9DF7;
      --ok:        #52BB7B;
      --warn:      #E09545;
      --danger:    #E86B60;
      --ok-bg:     #16281E;
      --warn-bg:   #2A2015;
      --danger-bg: #2C1917;
      --shadow:    0 1px 2px rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.6);

      --plate-a: #5D9DF7;
      --plate-b: #E86B60;
      --plate-e: #52BB7B;
      --plate-c: #E09545;
      --plate-d: #94A0AC;

      /* séries validadas contra a superfície escura #171B21 */
      --s1: #4F8CE4;
      --s2: #C98230;
      --grid: #262E37;
    }
  }

  :root[data-theme="dark"] {
    --bg:#0F1216; --surface:#171B21; --surface-2:#1E242B; --line:#2B333C; --line-soft:#232A32;
    --ink:#E9EDF1; --ink-2:#94A0AC; --ink-3:#6C7885;
    --accent:#5D9DF7; --ok:#52BB7B; --warn:#E09545; --danger:#E86B60;
    --ok-bg:#16281E; --warn-bg:#2A2015; --danger-bg:#2C1917;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.6);
    --plate-a:#5D9DF7; --plate-b:#E86B60; --plate-e:#52BB7B; --plate-c:#E09545; --plate-d:#94A0AC;
    --s1:#4F8CE4; --s2:#C98230; --grid:#262E37;
  }

  :root[data-theme="light"] {
    --bg:#EDEFF1; --surface:#FFFFFF; --surface-2:#F4F6F8; --line:#D2D8DE; --line-soft:#E3E8EC;
    --ink:#161A1F; --ink-2:#5B6570; --ink-3:#8A959F;
    --accent:#1F5FBF; --ok:#2E7D4F; --warn:#A85E16; --danger:#A82E27;
    --ok-bg:#E4F1E9; --warn-bg:#F8EEE0; --danger-bg:#F6E5E4;
    --shadow:0 1px 2px rgba(20,28,38,.07), 0 6px 16px -8px rgba(20,28,38,.16);
    --plate-a:#1F5FBF; --plate-b:#A82E27; --plate-e:#2E7D4F; --plate-c:#A85E16; --plate-d:#4A555F;
    --s1:#1F5FBF; --s2:#A85E16; --grid:#E3E8EC;
  }

  * { box-sizing: border-box; }

  .app {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 24px;
    -webkit-text-size-adjust: 100%;
  }
  .app.on-treino { padding-bottom: 96px; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 0 12px; }

  /* ---------- topo ---------- */
  .top {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .top-inner { max-width: 640px; margin: 0 auto; padding: 10px 12px 0; }

  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .brand .meso {
    font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    letter-spacing: .02em; white-space: nowrap;
  }

  /* navegação principal */
  .nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 10px 0 0; }
  .nav button {
    min-height: 40px; padding: 0 4px;
    border: 0; border-bottom: 2px solid transparent;
    background: transparent; color: var(--ink-3);
    font: 600 12.5px/1 var(--sans); cursor: pointer;
  }
  .nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs[hidden] { display: none; }

  .tab {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 7px;
    min-height: 44px; padding: 0 13px;
    border: 1px solid var(--line); border-radius: 3px;
    background: var(--surface-2); color: var(--ink-2);
    font: 600 13px/1 var(--sans); cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .tab .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tc); flex: 0 0 auto; }
  .tab .day {
    font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .tab[aria-selected="true"] {
    background: var(--surface); border-color: var(--tc); color: var(--ink);
    box-shadow: inset 0 -2px 0 var(--tc);
  }
  .tab[aria-selected="true"] .day { color: var(--ink-2); }

  /* ---------- aviso fixo do joelho ---------- */
  .knee {
    display: flex; gap: 9px; align-items: flex-start;
    margin: 12px 0 0; padding: 10px 12px;
    background: var(--danger-bg);
    border-left: 3px solid var(--danger);
    border-radius: 0 3px 3px 0;
    font-size: 12.5px; line-height: 1.45; color: var(--ink);
  }
  .knee strong { color: var(--danger); }

  /* ---------- cabeçalhos de seção ---------- */
  .sheet-head { padding: 18px 0 4px; }
  .eyebrow {
    font: 600 10.5px/1 var(--mono); letter-spacing: .12em;
    text-transform: uppercase; color: var(--tc);
  }
  .eyebrow.neutral { color: var(--ink-3); }
  .sheet-head h2 {
    margin: 8px 0 0; font-size: 25px; font-weight: 700;
    letter-spacing: -.025em; line-height: 1.1; text-wrap: balance;
  }
  .sheet-head .meta { margin-top: 6px; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }

  .cues {
    margin: 14px 0 0; padding: 12px 13px;
    background: var(--surface-2); border: 1px solid var(--line-soft);
    border-radius: 3px; font-size: 12.5px; line-height: 1.5; color: var(--ink-2);
  }
  .cues b { color: var(--ink); font-weight: 600; }

  /* ---------- cartão de exercício ---------- */
  .list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }

  .ex {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 4px; box-shadow: var(--shadow); overflow: hidden;
  }
  .ex-head { padding: 12px 13px 10px; display: flex; gap: 11px; }
  .ex-num {
    flex: 0 0 auto; width: 24px; height: 24px; margin-top: 1px;
    display: grid; place-items: center; border-radius: 2px;
    background: var(--tc); color: #fff; font: 700 12px/1 var(--mono);
  }
  :root[data-theme="dark"] .ex-num { color: #0F1216; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .ex-num { color: #0F1216; }
  }
  :root[data-theme="light"] .ex-num { color: #fff; }

  .ex-title { flex: 1 1 auto; min-width: 0; }
  .ex-title h3 { margin: 0; font-size: 15px; font-weight: 650; line-height: 1.3; letter-spacing: -.012em; }
  .presc {
    margin-top: 5px; font-family: var(--mono); font-size: 11.5px;
    color: var(--ink-2); letter-spacing: .01em;
  }
  .presc .sep { color: var(--ink-3); padding: 0 5px; }
  .ex-cue {
    margin-top: 7px; font-size: 12px; line-height: 1.45; color: var(--ink-2);
    border-left: 2px solid var(--line); padding-left: 9px;
  }

  /* substituições: fechadas por padrão, para quem treina fora e não tem o aparelho */
  details.alt { margin-top: 8px; }
  details.alt summary {
    display: inline-flex; align-items: center; gap: 5px;
    font: 600 11px/1 var(--sans); color: var(--tc);
    cursor: pointer; list-style: none;
    padding: 5px 0; min-height: 24px;
  }
  details.alt summary::-webkit-details-marker { display: none; }
  details.alt summary::before { content: "＋"; font-size: 12px; }
  details.alt[open] summary::before { content: "－"; }
  details.alt span {
    display: block; margin-top: 3px; padding-left: 9px;
    border-left: 2px solid var(--line);
    font-size: 12px; line-height: 1.5; color: var(--ink-2);
  }

  .last {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 7px 13px; background: var(--surface-2);
    border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft);
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .last .lbl { color: var(--ink-3); text-transform: uppercase; letter-spacing: .07em; font-size: 10px; }

  .bump, .fix {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px; border-radius: 2px;
    font: 700 11px/1 var(--mono); letter-spacing: .03em; white-space: nowrap;
  }
  .bump { background: var(--ok-bg); color: var(--ok); }
  .fix  { background: var(--warn-bg); color: var(--warn); }

  /* ---------- grade de séries ---------- */
  .sets { padding: 10px 13px 13px; display: flex; flex-direction: column; gap: 7px; }
  .set-hd, .set-row {
    display: grid; grid-template-columns: 22px 1fr 1fr 46px;
    gap: 7px; align-items: center;
  }
  .set-hd.no-kg, .set-row.no-kg { grid-template-columns: 22px 1fr 46px; }
  .set-hd {
    font: 600 9.5px/1 var(--mono); letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-3); padding-bottom: 1px;
  }
  .set-hd span:first-child { text-align: center; }
  .set-hd span:last-child { text-align: center; }

  .set-n {
    font: 600 12px/1 var(--mono); color: var(--ink-3); text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .fld { position: relative; }
  .fld input {
    width: 100%; height: 46px; padding: 0 30px 0 11px;
    border: 1px solid var(--line); border-radius: 3px;
    background: var(--surface-2); color: var(--ink);
    font: 600 17px/1 var(--mono); font-variant-numeric: tabular-nums;
    -webkit-appearance: none; appearance: none;
  }
  .fld input::placeholder { color: var(--ink-3); font-weight: 500; }
  .fld input:focus-visible {
    outline: none; border-color: var(--tc);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc) 22%, transparent);
  }
  .fld .unit {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    font: 600 10.5px/1 var(--mono); color: var(--ink-3);
    pointer-events: none; text-transform: uppercase; letter-spacing: .04em;
  }

  .chk {
    height: 46px; width: 46px; display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 3px;
    background: var(--surface-2); color: var(--ink-3);
    cursor: pointer; padding: 0;
    transition: background .12s, color .12s, border-color .12s;
  }
  .chk svg { width: 19px; height: 19px; }
  .chk[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  :root[data-theme="dark"] .chk[aria-pressed="true"] { color: #0F1216; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .chk[aria-pressed="true"] { color: #0F1216; }
  }
  .set-row.done .fld input { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }

  .rest-btn {
    margin-top: 3px; width: 100%; min-height: 40px;
    border: 1px dashed var(--line); border-radius: 3px;
    background: transparent; color: var(--ink-2);
    font: 600 12px/1 var(--sans); cursor: pointer;
  }
  .rest-btn:hover { border-color: var(--tc); color: var(--tc); }

  /* ---------- barra inferior ---------- */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
  }
  .bar[hidden] { display: none; }
  .bar-inner {
    max-width: 640px; margin: 0 auto;
    display: grid; grid-template-columns: auto 1fr auto; gap: 9px; align-items: center;
  }
  .timer {
    display: flex; align-items: center; gap: 8px;
    padding: 0 11px; height: 48px;
    border: 1px solid var(--line); border-radius: 3px; background: var(--surface-2);
  }
  .timer.run { border-color: var(--tc); }
  .timer.done { border-color: var(--ok); background: var(--ok-bg); }
  .timer .t {
    font: 700 19px/1 var(--mono); font-variant-numeric: tabular-nums;
    letter-spacing: -.01em; min-width: 56px; text-align: center;
  }
  .timer button {
    border: 0; background: transparent; color: var(--ink-2);
    font: 600 11px/1 var(--sans); cursor: pointer; padding: 6px 2px;
  }
  .timer button:hover { color: var(--ink); }

  .btn {
    height: 48px; padding: 0 15px;
    border: 1px solid transparent; border-radius: 3px;
    font: 650 13.5px/1 var(--sans); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  }
  .btn-sm { height: 40px; padding: 0 12px; font-size: 12.5px; }
  .btn-primary { background: var(--accent); color: #fff; }
  :root[data-theme="dark"] .btn-primary { color: #0F1216; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .btn-primary { color: #0F1216; }
  }
  .btn-ghost { background: var(--surface-2); border-color: var(--line); color: var(--ink-2); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .progress {
    font-family: var(--mono); font-size: 11px; color: var(--ink-2);
    text-align: center; line-height: 1.35;
  }
  .progress b { color: var(--ink); font-size: 13px; }

  /* ---------- painel de registro ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(8,11,15,.6);
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal.open { display: flex; }
  .panel {
    width: 100%; max-width: 640px; background: var(--surface);
    border-radius: 8px 8px 0 0; border-top: 3px solid var(--accent);
    padding: 16px 14px calc(16px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y: auto;
  }
  .panel h3 { margin: 0 0 3px; font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
  .panel p.sub { margin: 0 0 14px; font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }

  .measures { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 12px; }
  .measures label {
    display: block; font: 600 10px/1 var(--mono);
    text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin-bottom: 5px;
  }
  .measures input {
    width: 100%; height: 44px; padding: 0 11px;
    border: 1px solid var(--line); border-radius: 3px;
    background: var(--surface-2); color: var(--ink);
    font: 600 15px/1 var(--mono); -webkit-appearance: none; appearance: none;
  }
  .measures input:focus-visible { outline: none; border-color: var(--accent); }

  .out {
    width: 100%; min-height: 176px; padding: 11px;
    border: 1px solid var(--line); border-radius: 3px;
    background: var(--surface-2); color: var(--ink);
    font: 400 12.5px/1.55 var(--mono); resize: vertical;
  }
  .panel-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 11px; }

  .toast {
    position: fixed; left: 50%; bottom: 108px; transform: translateX(-50%) translateY(8px);
    z-index: 60; background: var(--ink); color: var(--bg);
    padding: 10px 15px; border-radius: 3px; font: 600 12.5px/1 var(--sans);
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .foot {
    margin: 22px 0 6px; padding-top: 14px;
    border-top: 1px solid var(--line-soft);
    font-size: 11.5px; line-height: 1.5; color: var(--ink-3);
  }
  .foot button {
    background: none; border: 0; padding: 0; color: var(--ink-3);
    text-decoration: underline; cursor: pointer; font: inherit;
  }

  /* ---------- cartões genéricos, gráficos e estatísticas ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 4px; box-shadow: var(--shadow);
    padding: 14px 13px; margin-top: 12px;
  }
  .card > h3 {
    margin: 0 0 2px; font-size: 14.5px; font-weight: 650; letter-spacing: -.012em;
  }
  .card > p.note { margin: 4px 0 0; font-size: 12px; line-height: 1.5; color: var(--ink-2); }

  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 12px; }
  .stat {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 4px; padding: 11px 10px;
  }
  .stat .k {
    font: 600 9.5px/1.2 var(--mono); letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .stat .v {
    margin-top: 6px; font: 700 21px/1 var(--mono);
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .stat .u { font-size: 11px; font-weight: 600; color: var(--ink-3); margin-left: 2px; }
  .stat .d { margin-top: 4px; font: 600 10.5px/1.2 var(--mono); color: var(--ink-3); }
  .stat .d.up { color: var(--ok); }
  .stat .d.dn { color: var(--warn); }

  .hero {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin-top: 10px;
  }
  .hero .big {
    font: 700 44px/1 var(--mono); font-variant-numeric: tabular-nums;
    letter-spacing: -.035em; color: var(--s2);
  }
  .hero .cap { font-size: 12.5px; line-height: 1.45; color: var(--ink-2); flex: 1 1 140px; }

  .meter { margin-top: 12px; }
  .meter-track {
    height: 10px; border-radius: 2px; background: var(--surface-2);
    border: 1px solid var(--line-soft); overflow: hidden;
  }
  .meter-fill { height: 100%; background: var(--s1); }
  .meter-fill.amber { background: var(--s2); }
  .meter-fill.good { background: var(--ok); }
  .meter-scale {
    display: flex; justify-content: space-between; margin-top: 5px;
    font: 600 10px/1 var(--mono); color: var(--ink-3);
  }

  .chart-wrap { margin-top: 12px; overflow-x: auto; }
  .chart { display: block; width: 100%; height: auto; }
  .chart .grid-line { stroke: var(--grid); stroke-width: 1; }
  .chart .axis-t { fill: var(--ink-3); font: 500 9px var(--mono); }
  .chart .ser { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .ser1 { stroke: var(--s1); }
  .chart .ser2 { stroke: var(--s2); }
  .chart .dot1 { fill: var(--s1); }
  .chart .dot2 { fill: var(--s2); }
  .chart .ring { stroke: var(--surface); stroke-width: 2; }
  .chart .dlabel { font: 700 10px var(--mono); }
  .chart .dlabel1 { fill: var(--s1); }
  .chart .dlabel2 { fill: var(--s2); }
  .chart .hit { fill: transparent; cursor: pointer; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 9px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); }
  .legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
  .legend i.c1 { background: var(--s1); }
  .legend i.c2 { background: var(--s2); }

  .readout {
    margin-top: 8px; padding: 7px 10px;
    background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 3px;
    font: 500 11.5px/1.4 var(--mono); color: var(--ink-2);
    font-variant-numeric: tabular-nums; min-height: 32px;
  }
  .readout b { color: var(--ink); font-weight: 700; }

  select.pick {
    width: 100%; height: 44px; padding: 0 34px 0 11px; margin-top: 10px;
    border: 1px solid var(--line); border-radius: 3px;
    background: var(--surface-2); color: var(--ink);
    font: 600 13px/1 var(--sans);
    -webkit-appearance: none; appearance: none;

  function blank() {
    return { last:{}, draft:{}, measures:{}, timer:null,
             sessions:[], body:[], food:{}, seeded:null };
  }

  function load() {
    var s;
    try {
      var raw = localStorage.getItem(KEY);
      s = raw ? JSON.parse(raw) : blank();
    } catch (e) { s = blank(); }
    var base = blank();
    for (var k in base) if (s[k] == null) s[k] = base[k];

    /* semeia o histórico do chat uma única vez, sem apagar o que já existe */
    if (s.seeded !== SEED_REV) {
      var have = {};
      s.sessions.forEach(function (x) { have[x.date + "|" + x.key] = true; });
      SEED_SESSIONS.forEach(function (x) {
        if (!have[x.date + "|" + x.key]) s.sessions.push(JSON.parse(JSON.stringify(x)));
      });
      var haveB = {};
      s.body.forEach(function (x) { haveB[x.date] = true; });
      SEED_BODY.forEach(function (x) { if (!haveB[x.date]) s.body.push(Object.assign({}, x)); });
      s.sessions.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      s.body.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      /* "última vez" vem da sessão mais recente de cada exercício, sem
         sobrescrever registro que o aparelho já tenha de data igual ou posterior */
      s.sessions.forEach(function (sess) {
        sess.ex.forEach(function (e) {
          var cur = s.last[e.id];
          if (!cur || cur.date <= sess.date) {
            s.last[e.id] = { kg: e.kg, reps: e.reps, date: sess.date };
          }
        });
      });
      s.seeded = SEED_REV;
    }
    return s;
  }

  function wk(key) {
    for (var i = 0; i < WORKOUTS.length; i++) if (WORKOUTS[i].key === key) return WORKOUTS[i];

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function today() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function br(iso) { var p = iso.split("-"); return p[2] + "/" + p[1]; }
  function dayms(iso) { var p = iso.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function num(v) { return v == null ? NaN : parseFloat(String(v).replace(",", ".")); }
  function fmt(n) {
    if (!isFinite(n)) return "—";
    return (Math.round(n * 10) / 10).toString().replace(".", ",");
  }
  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  function draftFor(key) {
    var d = store.draft[key];
    if (!d || d.date !== today()) { d = { date: today(), ex: {} }; store.draft[key] = d; }
    return d;
  }

  /* A carga que eu prescrevo (coachKg) só vale enquanto for mais nova que o
     último registro do aparelho. Assim que ele treina depois da orientação,
     o registro dele passa a mandar e a progressão nunca é apagada. */
  function coachActive(ex, prev) {
    if (ex.coachKg == null) return false;
    if (!prev) return true;
    return prev.date <= (ex.coachOn || "0000-00-00");
  }

  function exState(key, ex) {
    var d = draftFor(key);
    if (!d.ex[ex.id]) {
      var prev = store.last[ex.id];
      var kg = coachActive(ex, prev)
        ? String(ex.coachKg)
        : (prev ? prev.kg : (ex.start != null ? String(ex.start) : ""));
      d.ex[ex.id] = { kg: kg, reps: new Array(ex.sets).fill(""), done: new Array(ex.sets).fill(false) };
    }
    var s = d.ex[ex.id];
    while (s.reps.length < ex.sets) { s.reps.push(""); s.done.push(false); }
    return s;
  }

  /* dupla progressão: topo da faixa em TODAS as séries → sobe a carga */
  function bumpTarget(ex, st) {
    if (!ex.inc) return null;
    var kg = num(st.kg);
    if (!isFinite(kg)) return null;
    for (var i = 0; i < ex.sets; i++) {
      var r = num(st.reps[i]);
      if (!isFinite(r) || r < ex.hi) return null;
    }
    return round25(kg + ex.inc, ex.inc);
  }
  function round25(v, inc) { var f = inc >= 2.5 ? 2 : 1; return Math.round(v * f) / f; }

  function lastLine(ex, prev, bump) {
    var body = prev
      ? (ex.noLoad ? prev.reps.join("/") : fmt(num(prev.kg)) + " kg — " + prev.reps.join("/"))
      : "sem registro";
    var tag = "";
    if (bump) {
      tag = '<span class="bump">↑ SOBE PARA ' + fmt(bump) + " KG</span>";
    } else if (coachActive(ex, prev) && prev && num(prev.kg) !== ex.coachKg) {
      /* seta e cor seguem a direção real do ajuste — subir de verde, descer de âmbar */
      var up = ex.coachKg > num(prev.kg);
      tag = '<span class="' + (up ? "bump" : "fix") + '">' + (up ? "↑" : "↓") +
            " AJUSTE: " + fmt(ex.coachKg) + " KG</span>";
    }
    return '<span><span class="lbl">Última</span> ' + body + "</span>" + tag;
  }

  function checkSvg() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" ' +

  /* ==================== gráfico de linhas ==================== */
  /* SVG puro: sem libs, escala com o container e responde a toque.
     Marca fina (2px), grade recessiva, ponto final destacado e rotulado. */
  function lineChart(id, series, opts) {
    opts = opts || {};
    var W = 340, H = 168, ml = 36, mr = 14, mt = 12, mb = 24;
    var pts = [];
    series.forEach(function (s) { s.data.forEach(function (p) { pts.push(p); }); });
    if (!pts.length) return '<div class="empty">Sem dados ainda.</div>';

    var xs = pts.map(function (p) { return dayms(p.date); });
    var ys = pts.map(function (p) { return p.v; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    if (opts.zeroBase) y0 = 0;
    var padY = (y1 - y0) * 0.15 || Math.max(1, y1 * 0.05);
    y0 = Math.max(0, y0 - padY); y1 = y1 + padY;
    if (y1 - y0 < 0.5) { y1 = y0 + 1; }
    if (x1 === x0) { x0 -= 86400000; x1 += 86400000; }

    var px = function (d) { return ml + (dayms(d) - x0) / (x1 - x0) * (W - ml - mr); };
    var py = function (v) { return mt + (1 - (v - y0) / (y1 - y0)) * (H - mt - mb); };

    var s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" ' +
            'aria-label="' + esc(opts.aria || "gráfico") + '">';

    /* grade e rótulos do eixo Y */
    for (var g = 0; g <= 2; g++) {
      var v = y0 + (y1 - y0) * (g / 2), y = py(v);
      s += '<line class="grid-line" x1="' + ml + '" y1="' + y.toFixed(1) +
           '" x2="' + (W - mr) + '" y2="' + y.toFixed(1) + '"/>';
      s += '<text class="axis-t" x="' + (ml - 6) + '" y="' + (y + 3).toFixed(1) +
           '" text-anchor="end">' + fmt(v) + "</text>";
    }
    /* rótulos do eixo X: só primeiro e último */
    var allDates = pts.map(function (p) { return p.date; }).sort();
    s += '<text class="axis-t" x="' + ml + '" y="' + (H - 7) + '">' + br(allDates[0]) + "</text>";
    s += '<text class="axis-t" x="' + (W - mr) + '" y="' + (H - 7) +
         '" text-anchor="end">' + br(allDates[allDates.length - 1]) + "</text>";

    series.forEach(function (ser, si) {
      var cls = si === 0 ? "1" : "2";
      var d = ser.data.slice().sort(function (a, b) { return dayms(a.date) - dayms(b.date); });
      if (!d.length) return;
      var path = d.map(function (p, i) {
        return (i ? "L" : "M") + px(p.date).toFixed(1) + " " + py(p.v).toFixed(1);
      }).join(" ");
      s += '<path class="ser ser' + cls + '" d="' + path + '"/>';
      d.forEach(function (p, i) {
        var isLast = i === d.length - 1;
        var r = isLast ? 5 : 3.5;
        s += '<circle class="dot' + cls + (isLast ? " ring" : "") + '" cx="' + px(p.date).toFixed(1) +
             '" cy="' + py(p.v).toFixed(1) + '" r="' + r + '"/>';
      });
      var lastp = d[d.length - 1];
      var lx = px(lastp.date), ly = py(lastp.v);
      var anchor = lx > W - 60 ? "end" : "start";
      s += '<text class="dlabel dlabel' + cls + '" x="' + (anchor === "end" ? lx - 8 : lx + 8).toFixed(1) +
           '" y="' + (ly - 8).toFixed(1) + '" text-anchor="' + anchor + '">' +
           fmt(lastp.v) + (opts.unit || "") + "</text>";
    });

    /* alvos de toque: uma faixa por data, maior que a marca */
    var uniq = [];
    allDates.forEach(function (d) { if (uniq.indexOf(d) < 0) uniq.push(d); });
    uniq.forEach(function (dt) {
      var cx = px(dt), bw = (W - ml - mr) / Math.max(1, uniq.length);
      s += '<rect class="hit" x="' + (cx - bw / 2).toFixed(1) + '" y="' + mt +
           '" width="' + bw.toFixed(1) + '" height="' + (H - mt - mb) +
           '" data-chart="' + id + '" data-date="' + dt + '"></rect>';
    });

    s += "</svg>";
    return s;
  }

  function chartReadout(id, series, dt, unit) {
    var parts = [];
    series.forEach(function (ser) {
      var hit = null;
      ser.data.forEach(function (p) { if (p.date === dt) hit = p; });
      if (hit) parts.push(ser.name + " <b>" + fmt(hit.v) + (unit || "") + "</b>");
    });
    if (!parts.length) return "Toque no gráfico para ver um dia.";
    return br(dt) + " · " + parts.join(" · ");
  }

  function wireChart(id, series, unit) {
    var host = document.getElementById("ro-" + id);
    if (!host) return;
    elMain.querySelectorAll('[data-chart="' + id + '"]').forEach(function (r) {
      r.addEventListener("click", function () {
        host.innerHTML = chartReadout(id, series, r.getAttribute("data-date"), unit);
      });
    });
  }

  /* ==================== consultas sobre o histórico ==================== */

  function allExercises() {
    var map = {};
    store.sessions.forEach(function (s) {
      s.ex.forEach(function (e) { if (!map[e.id]) map[e.id] = e.n; });
    });
    WORKOUTS.forEach(function (w) { w.ex.forEach(function (e) { if (!map[e.id]) map[e.id] = e.n; }); });
    return map;
  }

  function seriesFor(exId) {
    var out = [];
    store.sessions.forEach(function (s) {
      s.ex.forEach(function (e) {
        if (e.id !== exId) return;
        var v = num(e.kg);
        if (isFinite(v)) out.push({ date: s.date, v: v });
      });
    });
    return out.sort(function (a, b) { return dayms(a.date) - dayms(b.date); });
  }

  function bodySeries(field) {
    return store.body.filter(function (b) { return b[field] != null && isFinite(b[field]); })
      .map(function (b) { return { date: b.date, v: +b[field] }; })
      .sort(function (a, b) { return dayms(a.date) - dayms(b.date); });
  }

  function sessionVolume(s) {
    var n = 0;
    s.ex.forEach(function (e) { n += e.reps.length; });
    return n;
  }

  function daysTo(iso) {
    return Math.round((dayms(iso) - dayms(today())) / 86400000);
  }

  /* ==================== renderização ==================== */

  function render() {
    renderNav();
    elTabs.hidden = view !== "treino";
    elBar.hidden = view !== "treino";
    elApp.classList.toggle("on-treino", view === "treino");
    if (view === "treino") renderTreino();
    else if (view === "hist") renderHist();
    else if (view === "corpo") renderCorpo();
    else renderDieta();
  }

  function renderNav() {
    var items = [["treino","Treino"],["hist","Histórico"],["corpo","Corpo"],["dieta","Dieta"]];
    elNav.innerHTML = "";
    items.forEach(function (it) {
      var b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", view === it[0] ? "true" : "false");
      b.textContent = it[1];
      b.addEventListener("click", function () {
        view = it[0]; render(); window.scrollTo({ top: 0 });
      });
      elNav.appendChild(b);
    });
  }

  function renderTabs() {
    elTabs.innerHTML = "";
    WORKOUTS.forEach(function (w) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "tab"; b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", w.key === current ? "true" : "false");
      b.style.setProperty("--tc", "var(" + w.color + ")");
      b.innerHTML = '<span class="dot"></span>' + w.key + ' <span class="day">' + w.day + "</span>";
      b.addEventListener("click", function () {
        current = w.key; stopTimer(); render(); window.scrollTo({ top: 0, behavior: "smooth" });
      });
      elTabs.appendChild(b);
    });
  }

  function renderTreino() {
    renderTabs();
    var w = wk(current);
    elMain.style.setProperty("--tc", "var(" + w.color + ")");
    elBar.style.setProperty("--tc", "var(" + w.color + ")");

    var html = '<div class="knee"><span>🦵</span><span><strong>Carta médica de 06/08:</strong> ' +
      'cadeira extensora só de <b>90° a 45°</b> na perna direita até <b>03/09</b>. ' +
      'Perna: 8-12 reps, RIR 2-3, 1-2 min de intervalo. Sem saltos, pliometria ou mudança de direção ' +
      'até <b>27/11</b>. Dor que irradia ou formigamento — para na hora.</span></div>';

    html += '<div class="sheet-head">' +
      '<div class="eyebrow">Treino ' + w.key + " · " + w.day + "-feira</div>" +
      "<h2>" + w.name + "</h2>" +
      '<div class="meta">' + w.sub + "  ·  " + w.dur + "</div></div>";
    html += '<div class="cues">' + w.cues + "</div>";

    html += '<div class="list">';
    w.ex.forEach(function (ex, i) {
      var st = exState(w.key, ex);
      var prev = store.last[ex.id];
      var bump = bumpTarget(ex, st);

      html += '<article class="ex" data-ex="' + ex.id + '">';
      html += '<div class="ex-head"><div class="ex-num">' + (i + 1) + "</div>" +
        '<div class="ex-title"><h3>' + ex.n + "</h3>" +
        '<div class="presc">' + ex.sets + " × " + (ex.lo === ex.hi ? ex.lo : ex.lo + "-" + ex.hi) +
        '<span class="sep">·</span>RIR ' + ex.rir +
        '<span class="sep">·</span>' + restLabel(ex.rest) + "</div>" +
        (ex.cue ? '<div class="ex-cue">' + ex.cue + "</div>" : "") +
        (ex.alt ? '<details class="alt"><summary>Não tem esse aparelho?</summary>' +
                  "<span>" + ex.alt + "</span></details>" : "") +
        "</div></div>";

      html += '<div class="last">' + lastLine(ex, prev, bump) + "</div>";

      var ru = ex.repsUnit || "rp";
      html += '<div class="sets">';
      html += '<div class="set-hd' + (ex.noLoad ? " no-kg" : "") + '"><span>#</span>' +
        (ex.noLoad ? "" : "<span>Carga</span>") +
        "<span>" + (ex.noLoad ? "Registro" : "Reps feitas") + "</span><span>OK</span></div>";
      for (var s = 0; s < ex.sets; s++) {
        html += '<div class="set-row' + (st.done[s] ? " done" : "") + (ex.noLoad ? " no-kg" : "") +
          '" data-set="' + s + '"><span class="set-n">' + (s + 1) + "</span>" +
          (ex.noLoad ? "" :
            '<div class="fld"><input type="text" inputmode="decimal" class="in-kg" value="' +
            esc(st.kg) + '" placeholder="—" aria-label="Carga série ' + (s + 1) + '">' +
            '<span class="unit">kg</span></div>') +
          '<div class="fld"><input type="text" inputmode="numeric" class="in-reps" value="' +
          esc(st.reps[s]) + '" placeholder="—" aria-label="' + ru + " série " + (s + 1) + '">' +
          '<span class="unit">' + ru + "</span></div>" +
          '<button type="button" class="chk" aria-pressed="' + (st.done[s] ? "true" : "false") +
          '" aria-label="Concluir série ' + (s + 1) + '">' + checkSvg() + "</button></div>";
      }
      html += '<button type="button" class="rest-btn" data-rest="' + ex.rest + '">Descanso ' +
        restLabel(ex.rest) + "</button></div></article>";
    });
    html += "</div>";

    html += '<div class="foot">Salvo automaticamente neste aparelho. ' +
      'Semana 6 (07–13/09) é deload: metade das séries, mesma carga.<br><br>' +
      '<button type="button" id="wipe">Apagar tudo que está salvo</button></div>';

    elMain.innerHTML = html;
    wireTreino();
    updateProgress();
  }

  function wireTreino() {
    var w = wk(current);
    elMain.querySelectorAll(".ex").forEach(function (card) {
      var exId = card.getAttribute("data-ex");
      var ex = null;
      w.ex.forEach(function (e) { if (e.id === exId) ex = e; });
      if (!ex) return;
      var st = exState(w.key, ex);

      card.querySelectorAll(".in-kg").forEach(function (input) {
        input.addEventListener("input", function () {
          st.kg = input.value;
          card.querySelectorAll(".in-kg").forEach(function (o) { if (o !== input) o.value = input.value; });
          save(); refreshLast(card, ex, st);
        });
      });

      card.querySelectorAll(".set-row").forEach(function (row) {
        var idx = parseInt(row.getAttribute("data-set"), 10);
        row.querySelector(".in-reps").addEventListener("input", function (e) {
          st.reps[idx] = e.target.value; save(); refreshLast(card, ex, st);
        });
        row.querySelector(".chk").addEventListener("click", function (e) {
          st.done[idx] = !st.done[idx];
          e.currentTarget.setAttribute("aria-pressed", st.done[idx] ? "true" : "false");
          row.classList.toggle("done", st.done[idx]);
          if (st.done[idx]) startTimer(ex.rest);
          save(); updateProgress();
        });
      });

      card.querySelector(".rest-btn").addEventListener("click", function (e) {
        startTimer(parseInt(e.currentTarget.getAttribute("data-rest"), 10));
      });
    });

    var wipe = document.getElementById("wipe");
    if (wipe) wipe.addEventListener("click", function () {
      if (window.confirm("Apagar TUDO: treinos, histórico, medidas e dieta. Não dá pra desfazer.")) {
        store = blank(); save(); store = load(); save(); render(); toast("Tudo apagado");
      }
    });
  }

  function refreshLast(card, ex, st) {
    card.querySelector(".last").innerHTML = lastLine(ex, store.last[ex.id], bumpTarget(ex, st));
  }

  function updateProgress() {
    var w = wk(current), done = 0, total = 0;
    w.ex.forEach(function (ex) {
      var st = exState(w.key, ex);
      total += ex.sets;
      for (var i = 0; i < ex.sets; i++) if (st.done[i]) done++;
    });
    elProg.innerHTML = "<b>" + done + "/" + total + "</b><br>séries";
  }

  /* ---------- histórico ---------- */

  function renderHist() {
    var map = allExercises();
    if (!histPick || !map[histPick]) histPick = "d1";
    if (!map[histPick]) histPick = Object.keys(map)[0];

    var data = seriesFor(histPick);
    var series = [{ name: "Carga", data: data }];
    var first = data.length ? data[0].v : null;
    var last = data.length ? data[data.length - 1].v : null;
    var delta = (first != null && last != null) ? last - first : null;

    var html = '<div class="sheet-head"><div class="eyebrow neutral">Histórico</div>' +
      "<h2>Evolução de carga</h2>" +
      '<div class="meta">' + store.sessions.length + " sessões registradas</div></div>";

    var opts = "";
    Object.keys(map).forEach(function (id) {
      opts += '<option value="' + id + '"' + (id === histPick ? " selected" : "") + ">" +
        esc(map[id]) + "</option>";
    });

    html += '<div class="card"><h3>Por exercício</h3>' +
      '<select class="pick" id="exPick" aria-label="Escolher exercício">' + opts + "</select>";

    if (data.length < 2) {
      html += '<div class="empty">Só ' + data.length + ' registro' + (data.length === 1 ? "" : "s") +
        ' desse exercício. O gráfico aparece a partir do segundo.</div>';
    } else {
      html += '<div class="chart-wrap">' +
        lineChart("ex", series, { unit: " kg", aria: "carga de " + map[histPick] + " ao longo do tempo" }) +
        "</div>";
      html += '<div class="readout" id="ro-ex">' +
        chartReadout("ex", series, data[data.length - 1].date, " kg") + "</div>";
    }

    if (delta != null && data.length > 1) {
      var pct = first > 0 ? (delta / first) * 100 : 0;
      html += '<div class="stat-row">' +
        stat("Início", fmt(first), "kg", br(data[0].date)) +
        stat("Agora", fmt(last), "kg", br(data[data.length - 1].date)) +
        stat("Variação", (delta >= 0 ? "+" : "") + fmt(delta), "kg",
             (pct >= 0 ? "+" : "") + fmt(pct) + "%", delta >= 0 ? "up" : "dn") +
        "</div>";
    }
    html += "</div>";

    /* tabela de sessões — a leitura alternativa ao gráfico */
    html += '<div class="card"><h3>Sessões</h3>';
    if (!store.sessions.length) {
      html += '<div class="empty">Nenhuma sessão fechada ainda.</div>';
    } else {
      html += '<div class="tbl-wrap"><table class="data"><thead><tr>' +
        "<th>Data</th><th>Treino</th><th>Exercícios</th><th>Séries</th></tr></thead><tbody>";
      store.sessions.slice().reverse().forEach(function (s) {
        html += "<tr><td class='n'>" + br(s.date) + "</td><td>" + esc(s.name || s.key) +
          "</td><td class='n'>" + s.ex.length + "</td><td class='n'>" + sessionVolume(s) + "</td></tr>";
      });
      html += "</tbody></table></div>";
    }
    html += "</div>";

    elMain.innerHTML = html;

    var pick = document.getElementById("exPick");
    if (pick) pick.addEventListener("change", function () {
      histPick = pick.value; renderHist();
    });
    if (data.length >= 2) wireChart("ex", series, " kg");
  }

  function stat(k, v, u, d, cls) {
    return '<div class="stat"><div class="k">' + esc(k) + '</div>' +
      '<div class="v">' + v + (u ? '<span class="u">' + u + "</span>" : "") + "</div>" +
      (d ? '<div class="d ' + (cls || "") + '">' + esc(d) + "</div>" : "") + "</div>";
  }

  /* ---------- corpo: joelho + medidas ---------- */

  function renderCorpo() {
    var dSer = seriesFor("p1b_d"), eSer = seriesFor("p1b_e");
    var dNow = dSer.length ? dSer[dSer.length - 1].v : null;
    var eNow = eSer.length ? eSer[eSer.length - 1].v : null;
    var sim = (dNow != null && eNow) ? (dNow / eNow) * 100 : null;

    var html = '<div class="sheet-head"><div class="eyebrow neutral">Corpo</div>' +
      "<h2>Joelho e medidas</h2>" +
      '<div class="meta">Pós-op de ' + Math.round((dayms(today()) - dayms("2026-05-27")) / 604800000) +
      " semanas</div></div>";

    /* painel do joelho */
    html += '<div class="card"><h3>Simetria de quadríceps</h3>' +
      '<p class="note">Carga da extensora unilateral: direita (operada) sobre esquerda. ' +
      "O critério usual para liberar esporte de contato é chegar perto de 90%.</p>";

    if (sim == null) {
      html += '<div class="empty">Registra a extensora dos dois lados pra esse número aparecer.</div>';
    } else {
      html += '<div class="hero"><span class="big">' + Math.round(sim) + "%</span>" +
        '<span class="cap">Direita ' + fmt(dNow) + " kg · esquerda " + fmt(eNow) + " kg.<br>" +
        "Faltam <b>" + Math.max(0, Math.round(90 - sim)) + " pontos</b> para os 90%.</span></div>";
      html += '<div class="meter"><div class="meter-track">' +
        '<div class="meter-fill amber" style="width:' + Math.min(100, sim) + '%"></div></div>' +
        '<div class="meter-scale"><span>0%</span><span>meta 90%</span></div></div>';
    }

    var knee = [];
    if (eSer.length) knee.push({ name: "Esquerda", data: eSer });
    if (dSer.length) knee.push({ name: "Direita (operada)", data: dSer });
    if (knee.length && (eSer.length > 1 || dSer.length > 1)) {
      html += '<div class="chart-wrap">' +
        lineChart("knee", knee, { unit: " kg", zeroBase: true, aria: "carga da extensora por lado" }) +
        "</div>";
      html += '<div class="legend"><span><i class="c1"></i>Esquerda</span>' +
        '<span><i class="c2"></i>Direita (operada)</span></div>';
      html += '<div class="readout" id="ro-knee">Toque no gráfico para ver um dia.</div>';
    }
    html += "</div>";

    /* marcos */
    html += '<div class="card"><h3>Marcos da reabilitação</h3><div class="marks">';
    var nextFound = false;
    MARCOS.forEach(function (m) {
      var dd = daysTo(m.d), done = dd < 0, next = !done && !nextFound;
      if (next) nextFound = true;
      html += '<div class="mark' + (done ? " done" : next ? " next" : "") + '"><span class="pip"></span>' +
        '<span class="t">' + esc(m.t) + "<small>" + esc(m.s) + "</small></span>" +
        '<span class="when">' + br(m.d) + "<br>" +
        (done ? "feito" : "faltam " + dd + "d") + "</span></div>";
    });
    html += "</div></div>";

    /* cintura */
    var cSer = bodySeries("cintura");
    html += '<div class="card"><h3>Cintura</h3>' +
      '<p class="note">Metas: 88,0 cm até 13/09 · 84,0 cm até dezembro. Medir 1x por semana, no umbigo.</p>';
    if (cSer.length >= 2) {
      html += '<div class="chart-wrap">' + lineChart("cint", [{ name: "Cintura", data: cSer }],
        { unit: " cm", aria: "cintura ao longo do tempo" }) + "</div>";
      html += '<div class="readout" id="ro-cint">' +
        chartReadout("cint", [{ name: "Cintura", data: cSer }], cSer[cSer.length - 1].date, " cm") + "</div>";
    } else {
      html += '<div class="empty">Precisa de pelo menos duas medidas.</div>';
    }
    if (cSer.length) {
      var cNow = cSer[cSer.length - 1].v;
      html += '<div class="stat-row">' +
        stat("Agora", fmt(cNow), "cm", br(cSer[cSer.length - 1].date)) +
        stat("Meta 13/09", "88,0", "cm", fmt(cNow - 88) + " cm a perder") +
        stat("Meta dez", "84,0", "cm", fmt(cNow - 84) + " cm a perder") +
        "</div>";
    }
    html += "</div>";

    /* peso */
    var pSer = bodySeries("peso");
    html += '<div class="card"><h3>Peso</h3>' +
      '<p class="note">Um dia isolado é ruído — o que vale é a tendência. Sempre a mesma balança.</p>';
    if (pSer.length >= 2) {
      html += '<div class="chart-wrap">' + lineChart("peso", [{ name: "Peso", data: pSer }],
        { unit: " kg", aria: "peso ao longo do tempo" }) + "</div>";
      html += '<div class="readout" id="ro-peso">' +
        chartReadout("peso", [{ name: "Peso", data: pSer }], pSer[pSer.length - 1].date, " kg") + "</div>";
    } else {
      html += '<div class="empty">Precisa de pelo menos duas pesagens.</div>';
    }
    html += "</div>";

    /* registrar medida */
    html += '<div class="card"><h3>Registrar medida de hoje</h3>' +
      '<div class="measures"><div><label for="bPeso">Peso (kg)</label>' +
      '<input id="bPeso" type="text" inputmode="decimal" placeholder="—"></div>' +
      '<div><label for="bCint">Cintura (cm)</label>' +
      '<input id="bCint" type="text" inputmode="decimal" placeholder="—"></div></div>' +
      '<button type="button" class="btn btn-primary btn-sm" id="saveBody">Salvar medida</button></div>';

    elMain.innerHTML = html;

    if (knee.length && (eSer.length > 1 || dSer.length > 1)) wireChart("knee", knee, " kg");
    if (cSer.length >= 2) wireChart("cint", [{ name: "Cintura", data: cSer }], " cm");
    if (pSer.length >= 2) wireChart("peso", [{ name: "Peso", data: pSer }], " kg");

    document.getElementById("saveBody").addEventListener("click", function () {
      var p = num(document.getElementById("bPeso").value);
      var c = num(document.getElementById("bCint").value);
      if (!isFinite(p) && !isFinite(c)) { toast("Preenche peso ou cintura"); return; }
      pushBody(isFinite(p) ? p : null, isFinite(c) ? c : null);
      toast("Medida salva"); renderCorpo();
    });
  }

  function pushBody(peso, cintura) {
    var d = today(), row = null;
    store.body.forEach(function (b) { if (b.date === d) row = b; });
    if (!row) { row = { date: d, peso: null, cintura: null }; store.body.push(row); }
    if (peso != null) row.peso = peso;
    if (cintura != null) row.cintura = cintura;
    store.body.sort(function (a, b) { return dayms(a.date) - dayms(b.date); });
    save();
  }

  /* ---------- dieta ---------- */

  function renderDieta() {
    var d = today();
    var list = store.food[d] || [];
    var total = list.reduce(function (a, x) { return a + x.g; }, 0);
    var pct = Math.min(100, (total / PROT_ALVO) * 100);
    var falta = Math.max(0, PROT_ALVO - total);

    var html = '<div class="sheet-head"><div class="eyebrow neutral">Dieta</div>' +
      "<h2>Proteína de hoje</h2>" +
      '<div class="meta">Alvo ' + PROT_ALVO + " g · déficit de ~350 kcal</div></div>";

    html += '<div class="card"><div class="hero">' +
      '<span class="big" style="color:' + (falta ? "var(--s1)" : "var(--ok)") + '">' + total + "</span>" +
      '<span class="cap">de ' + PROT_ALVO + " g<br>" +
      (falta ? "Faltam <b>" + falta + " g</b>." : "<b>Alvo batido.</b>") + "</span></div>" +
      '<div class="meter"><div class="meter-track"><div class="meter-fill' + (falta ? "" : " good") +
      '" style="width:' + pct + '%"></div></div>' +
      '<div class="meter-scale"><span>0 g</span><span>' + PROT_ALVO + " g</span></div></div>";

    html += '<div class="meal-grid">';
    MEALS.forEach(function (m, i) {
      html += '<button type="button" class="meal" data-meal="' + i + '">' + esc(m.l) +
        '<span class="g">+' + m.g + " g · " + esc(m.s) + "</span></button>";
    });
    html += "</div>";

    if (list.length) {
      html += '<div class="today-list">';
      list.forEach(function (x, i) {
        html += '<div class="today-item"><span>' + esc(x.l) + '</span>' +
          '<span><span class="g">' + x.g + ' g</span> ' +
          '<button type="button" data-del="' + i + '" aria-label="Remover">×</button></span></div>';
      });
      html += "</div>";
    }
    html += "</div>";

    html += '<div class="card"><h3>Prato padrão</h3>' +
      '<p class="note">200 g de carne (2 palmas) + 1,5 concha de feijão + 4 colheres de arroz + 1 fruta. ' +
      "Fritura e linguiça: 1–2x por semana. Refrigerante zero pode, normal não.</p></div>";

    elMain.innerHTML = html;

    elMain.querySelectorAll("[data-meal]").forEach(function (b) {
      b.addEventListener("click", function () {
        var m = MEALS[+b.getAttribute("data-meal")];
        if (!store.food[d]) store.food[d] = [];
        store.food[d].push({ l: m.l, g: m.g });
        save(); renderDieta();
      });
    });
    elMain.querySelectorAll("[data-del]").forEach(function (b) {
      b.addEventListener("click", function () {
        store.food[d].splice(+b.getAttribute("data-del"), 1);
        save(); renderDieta();
      });
    });
  }

  /* ==================== timer ====================
     Ancorado em horário real (Date.now()), não em contagem de tick:
     o celular bloqueia a tela e o navegador suspende o setInterval, mas o
     relógio continua correndo. Ao reabrir, recalcula o tempo restante a
     partir do horário de término gravado. O estado fica em localStorage
     para sobreviver a um reload (iOS descarta abas em segundo plano). */

  function startTimer(sec) {
    var end = Date.now() + sec * 1000;
    timer.end = end; timer.total = sec;
    store.timer = { end: end, total: sec }; save();
    elTimer.classList.add("run"); elTimer.classList.remove("done");
    tickTimer();
    if (timer.id) clearInterval(timer.id);
    timer.id = setInterval(tickTimer, 1000);
  }

  function tickTimer() {
    if (timer.end == null) return;
    var left = Math.ceil((timer.end - Date.now()) / 1000);
    if (left <= 0) {
      left = 0;
      if (timer.id) clearInterval(timer.id);
      timer.id = null;
      elTimer.classList.remove("run");
      if (!elTimer.classList.contains("done")) {
        elTimer.classList.add("done");
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }
      store.timer = null; save();
    }
    timer.left = left; paintTimer();
  }

  function stopTimer() {
    if (timer.id) clearInterval(timer.id);
    timer.id = null; timer.left = 0; timer.end = null;
    store.timer = null; save();
    elTimer.classList.remove("run", "done"); paintTimer();
  }

  function paintTimer() {
    var m = Math.floor(timer.left / 60), s = timer.left % 60;
    elTimerT.textContent = m + ":" + pad(s);
  }

  function resumeTimer() {
    if (!store.timer) { paintTimer(); return; }
    timer.end = store.timer.end; timer.total = store.timer.total;
    if (Math.ceil((timer.end - Date.now()) / 1000) <= 0) {
      timer.left = 0; timer.end = null; store.timer = null; save();
      elTimer.classList.add("done"); paintTimer(); return;
    }
    elTimer.classList.add("run"); tickTimer();
    timer.id = setInterval(tickTimer, 1000);
  }

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && (timer.id || store.timer)) tickTimer();
    if (document.visibilityState === "hidden") save();
  });

  document.getElementById("timerT").addEventListener("click", function () {
    if (timer.id) stopTimer(); else if (timer.total) startTimer(timer.total);
  });
  document.getElementById("timerPlus").addEventListener("click", function () {
    var left = timer.end ? Math.max(0, Math.ceil((timer.end - Date.now()) / 1000)) : 0;
    startTimer(left + 30);
  });
  document.getElementById("timerMinus").addEventListener("click", function () {
    var left = timer.end ? Math.max(0, Math.ceil((timer.end - Date.now()) / 1000)) : 0;
    if (left - 30 <= 0) stopTimer(); else startTimer(left - 30);
  });

  /* ==================== fechar treino ==================== */

  function buildLog() {
    var w = wk(current), d = new Date();
    var lines = ["Treino " + w.key + " (" + w.name + ") feito — " +
                 pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "."];
    w.ex.forEach(function (ex) {
      var st = exState(w.key, ex);
      var reps = st.reps.filter(function (r) { return String(r).trim() !== ""; });
      if (!reps.length && !String(st.kg).trim()) return;
      var unit = ex.repsUnit || "rp";
      if (ex.noLoad) {
        lines.push("• " + ex.n + " — " + (reps.length ? reps.join("/") + " " + unit : "sem registro") +
                   (ex.rir !== "—" ? " (RIR " + ex.rir + ")" : ""));
        return;
      }
      var kg = num(st.kg);
      lines.push("• " + ex.n + " — " + (isFinite(kg) ? fmt(kg) + " kg" : "?") +
                 (reps.length ? " — " + reps.join("/") : "") + " (RIR " + ex.rir + ")");
    });
    var peso = document.getElementById("mPeso").value.trim();
    var cint = document.getElementById("mCint").value.trim();
    if (peso) lines.push("Peso: " + peso + " kg");
    if (cint) lines.push("Cintura: " + cint + " cm");
    return lines.join("\n");
  }

  document.getElementById("finish").addEventListener("click", function () {
    document.getElementById("mPeso").value = "";
    document.getElementById("mCint").value = "";
    elOut.value = buildLog();
    elModal.classList.add("open");
  });

  ["mPeso", "mCint"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", function () { elOut.value = buildLog(); });
  });

  document.getElementById("closeModal").addEventListener("click", function () {
    elModal.classList.remove("open");
  });
  elModal.addEventListener("click", function (e) {
    if (e.target === elModal) elModal.classList.remove("open");
  });

  document.getElementById("copy").addEventListener("click", function () {
    var text = elOut.value;
    var ok = function () { commit(); toast("Copiado — cola no chat"); elModal.classList.remove("open"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, manual);
    } else manual();
    function manual() {
      elOut.removeAttribute("readonly"); elOut.select();
      try { document.execCommand("copy"); ok(); }
      catch (e) { toast("Seleciona o texto e copia na mão"); }
      elOut.setAttribute("readonly", "readonly");
    }
  });

  /* fecha a sessão: vira "última vez" e entra no histórico */
  function commit() {
    var w = wk(current), rec = { date: today(), key: w.key, name: w.name, ex: [] };
    w.ex.forEach(function (ex) {
      var st = exState(w.key, ex);
      var reps = st.reps.filter(function (r) { return String(r).trim() !== ""; });
      if (!reps.length) return;
      store.last[ex.id] = { kg: st.kg, reps: reps, date: today() };
      rec.ex.push({ id: ex.id, n: ex.n, kg: st.kg, reps: reps,
                    noLoad: !!ex.noLoad, repsUnit: ex.repsUnit || null });
    });
    if (rec.ex.length) {
      var i = -1;
      store.sessions.forEach(function (s, ix) { if (s.date === rec.date && s.key === rec.key) i = ix; });
      if (i >= 0) store.sessions[i] = rec; else store.sessions.push(rec);
      store.sessions.sort(function (a, b) { return dayms(a.date) - dayms(b.date); });
    }
    var p = num(document.getElementById("mPeso").value);
    var c = num(document.getElementById("mCint").value);
    if (isFinite(p) || isFinite(c)) pushBody(isFinite(p) ? p : null, isFinite(c) ? c : null);
    delete store.draft[w.key];
    save(); render();
  }

  var toastT = null;
  function toast(msg) {
    elToast.textContent = msg; elToast.classList.add("show");
    if (toastT) clearTimeout(toastT);
    toastT = setTimeout(function () { elToast.classList.remove("show"); }, 2200);
  }

  save();
  render();
  resumeTimer();
  window.addEventListener("pagehide", save);
})();
</script>
